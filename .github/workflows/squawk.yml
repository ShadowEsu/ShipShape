# Advisory migration lint (database-migrations skill; Security 2026-11-04 0747): never add it to required checks.
# Squawk reads the changed migrations' SQL text only: the image pinned by digest, no network, read-only, no env or secrets.
# --assume-in-transaction because lib/server/migrations.ts applies each file inside one transaction; --pg-version is RDS's.
name: squawk (advisory)
on:
  pull_request:
    paths: ["supabase/migrations/**"]
permissions:
  contents: read
jobs:
  squawk:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint changed migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r -d '' f; do
            if [[ $f =~ ^supabase/migrations/[0-9]{4}_[a-z0-9_]+\.sql$ ]]; then args+=("/m/${f#supabase/migrations/}"); fi
          done < <(git diff -z --name-only --diff-filter=AM "$BASE_SHA" HEAD -- supabase/migrations/)
          if [ ${#args[@]} -eq 0 ]; then echo "No migration files changed."; exit 0; fi
          out="$RUNNER_TEMP/squawk.txt"; rc=0
          docker run --rm --network none --read-only \
            -v "$PWD/supabase/migrations:/m:ro" \
            ghcr.io/sbdchd/squawk@sha256:439751d978b127ccf882e76967efb754ae2421ffd5161dd1d401b7cfbb6e354b \
            --assume-in-transaction --pg-version=17.0 "${args[@]}" > "$out" 2>&1 || rc=$?
          cat "$out"
          # Advisory: findings (exit 1 plus Squawk's summary line) are a warning and the check passes, because prod-merge
          # refuses any failing check. Anything else (pull, run or Squawk error, which also exits 1) fails, so a broken
          # lint never passes (Trainer, from Squawk 2.71.0's reporter.rs).
          if [ "$rc" -eq 1 ] && grep -q -E 'Found [0-9]+ issues? in [0-9]+ files? \(checked' "$out"; then
            echo "::warning::Squawk found issues in the changed migrations (advisory; read the log above)"; exit 0
          fi
          exit "$rc"
