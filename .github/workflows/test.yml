name: test

on:
  push:
    branches: [rebuild]
  pull_request:
    branches: [rebuild]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Tests on PGlite
        run: npm test
      - name: Start PostgreSQL 17 (TLS only over TCP)
        run: scripts/ci-postgres.sh "$RUNNER_TEMP/pg"
      - name: Tests on PostgreSQL 17, through the production driver
        run: |
          SHIPSHAPE_PG_TEST_URL="$(cat "$RUNNER_TEMP/pg/url")" DATABASE_CA_CERT="$(cat "$RUNNER_TEMP/pg/ca.pem")" npm test
      - name: Start an S3 stand-in (moto 5.2.5, every package pinned by hash)
        run: |
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet --require-hashes -r scripts/ci-moto-requirements.txt
          "$RUNNER_TEMP/moto/bin/moto_server" -H 127.0.0.1 -p 5917 > "$RUNNER_TEMP/moto.log" 2>&1 &
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:5917 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/moto.log"
          exit 1
      - name: File-store checks against the S3 API
        run: npm run test:s3

  secrets:
    # The repo's secret scan, on every push and pull request, over the whole history (W12-15; until now
    # it ran only as a local pre-commit hook). gitleaks v8.30.1 pinned by its image digest: a new digest
    # only ever arrives as a reviewed change to this file. The container gets the checkout read-only,
    # no network, no secrets or environment; findings are redacted and fail the run; no report is kept.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over every commit
        run: docker run --rm --network none -v "$PWD:/repo:ro" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner --exit-code 1 /repo
