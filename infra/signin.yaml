AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ShipShape sign-in (aws-plan.md, Sign-in row; Security's M6 pool and client list in
  20261031-0541): a Cognito user pool, Essentials tier, with managed login and one confidential
  app client. The app verifies the ID token itself, then its own session cookie takes over.

Parameters:
  AppUrl:
    Type: String
    Description: SHIPSHAPE_APP_URL, the production origin (https, no trailing slash).
    AllowedPattern: "^https://[a-z0-9.-]+$"
  DomainPrefix:
    Type: String
    Description: Managed login's domain prefix; COGNITO_DOMAIN becomes https://<prefix>.auth.<region>.amazoncognito.com.
    AllowedPattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
  # Sign-up and recovery codes from ShipShape's own address through SES (Security 2026-11-04 0715,
  # answer 5), instead of Cognito's default no-reply@verificationemail.com. Both empty (the default):
  # Cognito's default sender, which is what the privacy policy names. Set them only once SES has left
  # the sandbox (in the sandbox Cognito can't email anyone unverified, so nobody could sign up), and
  # change the privacy policy's sender in the same release (README, "Email").
  CodesFrom:
    Type: String
    Default: ""
    Description: The From line for Cognito's email, e.g. "ShipShape <reminders@<domain>>"; its address is in the identity's domain. Empty means Cognito's default sender.
    AllowedPattern: "^$|^[^<>]{0,64} ?<[A-Za-z0-9._%+-]+@[a-z0-9.-]+\\.[a-z]{2,}>$|^[A-Za-z0-9._%+-]+@[a-z0-9.-]+\\.[a-z]{2,}$"
  CodesIdentityArn:
    Type: String
    Default: ""
    Description: mail.yaml output IdentityArn. Empty means Cognito's default sender.
    AllowedPattern: "^$|^arn:aws:ses:[a-z0-9-]+:[0-9]{12}:identity/[a-z0-9.-]+$"

Conditions:
  CodesThroughSes: !And
    - !Not [!Equals [!Ref CodesFrom, ""]]
    - !Not [!Equals [!Ref CodesIdentityArn, ""]]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    # Accounts: deleting the stack never deletes them (and DeletionProtection refuses it anyway).
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: shipshape
      UserPoolTier: ESSENTIALS
      DeletionProtection: ACTIVE
      # Sign-in by email; email required and verified (the app refuses email_verified != true).
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes:
        - email
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
      # MFA required, TOTP only (no SMS, no email codes).
      MfaConfiguration: "ON"
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # Self-registration on.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      # Off by default (CodesThroughSes, above): only once SES is out of the sandbox, Security #5. On, Cognito
      # sends through the same identity and configuration set as the reminders, so its bounces and
      # complaints are suppressed too. DEVELOPER makes Cognito create its service-linked role, so the
      # deploying session needs iam:CreateServiceLinkedRole.
      EmailConfiguration: !If
        - CodesThroughSes
        - EmailSendingAccount: DEVELOPER
          SourceArn: !Ref CodesIdentityArn
          From: !Ref CodesFrom
          ConfigurationSet: shipshape-mail
        - !Ref AWS::NoValue

  # Managed login (version 2), not the classic hosted UI: only managed login honours prompt=login.
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref DomainPrefix
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2

  AppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: shipshape-app
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
      CallbackURLs:
        - !Sub "${AppUrl}/auth/callback"
      SupportedIdentityProviders:
        - COGNITO
      # No password flows for the client; managed login signs in, refresh only renews.
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      # Never email: else a user could change it to someone else's address.
      ReadAttributes:
        - email
        - email_verified
      WriteAttributes:
        - name
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days

  # Managed login shows an error page for a client without a style: Cognito's default one.
  AppClientLoginStyle:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref AppClient
      UseCognitoProvidedValues: true

Outputs:
  UserPoolId:
    Description: COGNITO_USER_POOL_ID and PROBE_COGNITO_POOL_ID.
    Value: !Ref UserPool
  UserPoolArn:
    Description: UserPoolArn for app-role.yaml.
    Value: !GetAtt UserPool.Arn
  ClientId:
    Description: COGNITO_CLIENT_ID and PROBE_COGNITO_CLIENT_ID (the secret stays in Cognito; read it once into Vercel).
    Value: !Ref AppClient
  Domain:
    Description: COGNITO_DOMAIN.
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
