AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ShipShape's runtime credentials (aws-plan.md, Credentials row and IAM policy drafts; Security
  S3-1): Vercel's OIDC provider and the role shipshape-prod-app, which only the production
  environment of the shipshape project can assume. No stored keys, no permissions boundary, one
  inline policy. Deploy after storage.yaml and signin.yaml.

Parameters:
  VercelTeam:
    Type: String
    Description: Vercel team slug; the issuer is https://oidc.vercel.com/<team> (team issuer mode).
    AllowedPattern: "^[a-z0-9][a-z0-9_-]*$"
  Audience:
    Type: String
    Description: The token's aud, https://vercel.com/<team>.
    AllowedPattern: "^https://vercel\\.com/[a-z0-9][a-z0-9_-]*$"
  ProductionSub:
    Type: String
    Description: The one sub trusted, owner:<team>:project:shipshape:environment:production.
    # Production only, and no wildcard: a preview's token (environment:preview) is refused by STS.
    AllowedPattern: "^owner:[a-z0-9][a-z0-9_-]*:project:[a-z0-9][a-z0-9._-]*:environment:production$"
  BucketName:
    Type: String
    Description: storage.yaml output BucketName.
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
  FileKeyArn:
    Type: String
    Description: storage.yaml output KeyArn.
    AllowedPattern: "^arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/[0-9a-f-]+$"
  UserPoolArn:
    Type: String
    Description: signin.yaml output UserPoolArn.
    AllowedPattern: "^arn:aws:cognito-idp:[a-z0-9-]+:[0-9]{12}:userpool/[a-z0-9-]+_[A-Za-z0-9]+$"
  # Reminder email (B12; Security 2026-11-04 0715, answer 5). Both empty (the default): the role has no
  # SES permission at all. Set only after SES leaves the sandbox, with Preston's sender address and
  # Security's GO on the PR (README, "Email").
  SenderAddress:
    Type: String
    Default: ""
    Description: SHIPSHAPE_EMAIL_FROM, the one From address the app may send as. Empty means no email.
    AllowedPattern: "^$|^[A-Za-z0-9._%+-]+@[a-z0-9.-]+\\.[a-z]{2,}$"
  SenderIdentityArn:
    Type: String
    Default: ""
    Description: mail.yaml output IdentityArn, the sender's verified domain. Empty means no email.
    AllowedPattern: "^$|^arn:aws:ses:[a-z0-9-]+:[0-9]{12}:identity/[a-z0-9.-]+$"

Conditions:
  SendsEmail: !And
    - !Not [!Equals [!Ref SenderAddress, ""]]
    - !Not [!Equals [!Ref SenderIdentityArn, ""]]

Resources:
  VercelOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: !Sub "https://oidc.vercel.com/${VercelTeam}"
      ClientIdList:
        - !Ref Audience

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: shipshape-prod-app
      Description: ShipShape production on Vercel (OIDC); files, their key, and deleting sign-ins.
      MaxSessionDuration: 3600
      # A JSON string because the condition keys carry the team (oidc.vercel.com/<team>:sub), and a
      # YAML key can't hold !Sub. StringEquals only, exactly aud and sub (PR-3).
      AssumeRolePolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": { "Federated": "${VercelOidcProvider}" },
            "Action": "sts:AssumeRoleWithWebIdentity",
            "Condition": { "StringEquals": {
              "oidc.vercel.com/${VercelTeam}:aud": "${Audience}",
              "oidc.vercel.com/${VercelTeam}:sub": "${ProductionSub}"
            } }
          }]
        }
      # The one inline policy: every action the app needs, each on its one resource (PR-2, P-b0a).
      # Conditions, which the probe pins exactly: listing only under a workspace's "<org id>/" prefix
      # (the daily sweep after an account deletion, W11-7, aws-plan TO-1; and telling a missing file from
      # a refused one, W12-1), the key only through S3 (W12-11), and, where email is on, sending only as
      # the one sender. No managed policies, no boundary.
      Policies:
        - PolicyName: app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Files
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${BucketName}/*"
              - Sid: SweepDeletedWorkspace
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${BucketName}"
                Condition:
                  StringLike:
                    # A workspace id, a slash, then anything: the sweep lists "<id>/", and the app asks
                    # for one exact key to tell a missing file from a refused one (W12-1). Listing "<id>/"
                    # already returned every key under it, so this adds nothing a role session could see.
                    # The app checks the id's exact shape before it lists.
                    s3:prefix: "????????-????-????-????-????????????/*"
              - Sid: FileKey
                Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:Decrypt
                Resource: !Ref FileKeyArn
                # Only S3's SSE-KMS uses the key for the app: a leaked role session can't call KMS directly.
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "s3.${AWS::Region}.amazonaws.com"
              - Sid: DeleteAccounts
                Effect: Allow
                Action: cognito-idp:AdminDeleteUser
                Resource: !Ref UserPoolArn
              # Only with SenderAddress and SenderIdentityArn set (Security 2026-11-04 0715, answer 5):
              # SendEmail alone (no SendRawEmail, SendBulkEmail or ses:*), on the sender's identity and the
              # configuration set SendEmail names (mail.yaml; SES v2 authorizes both), from that one address.
              - !If
                - SendsEmail
                - Sid: SendReminders
                  Effect: Allow
                  Action: ses:SendEmail
                  Resource:
                    - !Ref SenderIdentityArn
                    - !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/shipshape-mail"
                  Condition:
                    StringEquals:
                      ses:FromAddress: !Ref SenderAddress
                - !Ref AWS::NoValue

Outputs:
  RoleArn:
    Description: AWS_ROLE_ARN (Vercel Production only).
    Value: !GetAtt AppRole.Arn
  RoleName:
    Description: PROBE_ROLE_NAME.
    Value: !Ref AppRole
  OidcProviderArn:
    Description: PROBE_OIDC_PROVIDER_ARN.
    Value: !Ref VercelOidcProvider
